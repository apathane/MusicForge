<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="640" fill="#000000"/>
  
  <!-- Left side: Wordmark and tagline -->
  <g transform="translate(80, 160)">
    <!-- MusicForge wordmark -->
    <text x="0" y="0" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="96" 
          fill="#FFFFFF" 
          letter-spacing="-2">
      MusicForge
    </text>
    
    <!-- Tagline -->
    <text x="0" y="130" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="400" 
          font-size="28" 
          fill="#AAAAAA" 
          letter-spacing="0.5">
      A YouTube Music player that downloads fast, works offline, and stays out of your way.
    </text>
    
    <!-- Credits line -->
    <text x="0" y="200" 
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="400" 
          font-size="18" 
          fill="#666666">
      Built on Metrolist, InnerTubeX, ConvX, Kyant0/backdrop, BitChord, Inter, LRCLIB
    </text>
  </g>
  
  <!-- Right side: Player screenshot -->
  <image x="720" y="60" width="500" height="520" 
         href="docs/screenshots/player.jpg" 
         preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Subtle frame around screenshot -->
  <rect x="720" y="60" width="500" height="520" 
        fill="none" stroke="#333333" stroke-width="2" rx="8"/>
</svg>