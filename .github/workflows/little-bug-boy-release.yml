name: Little Bug Boy release

on:
  push:
    branches:
      - release/0.13.1-little-bug-boy

permissions:
  contents: write

concurrency:
  group: little-bug-boy-release
  cancel-in-progress: false

jobs:
  verify-build-publish:
    name: Verify, build and publish 0.13.1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build, test and lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --continue \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :innertube:testDebugUnitTest \
            :innertube:lintDebug \
            :app:assembleRelease

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find /dev/shm/musicforge-build/app/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" || { echo "::error::Release APK was not produced"; exit 1; }
          mkdir -p dist
          cp "$apk" dist/MusicForge-0.13.1-Little-Bug-Boy.apk
          sha256sum dist/MusicForge-0.13.1-Little-Bug-Boy.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK and checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: MusicForge-0.13.1-Little-Bug-Boy
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.13.1-little-bug-boy \
            dist/MusicForge-0.13.1-Little-Bug-Boy.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MusicForge 0.13.1 - Little Bug Boy" \
            --notes "Maintenance release based on Rondo (0.13.0). Fixes malformed LRC timestamps and LRCLIB result selection when duration is unknown. Includes regression tests; no database migration."
