name: CI

on:
  push:
    # agent/** : branches pushed by scripts/ci-check.sh, so agents build here instead of locally.
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate landing page and Android security wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check site/main.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle.kts").read_text()
          site = Path("site/index.html").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          phase = re.search(r'val phase = (\d+)', gradle)
          codename = re.search(r'val codename = "([^"]+)"', gradle)
          assert phase and codename, "Could not read app version from Gradle"
          # The v0.2 site shows the version as "SONATA / 0.14" in the header and closing panel.
          expected = f"{codename.group(1).upper()} / 0.{phase.group(1)}"
          assert expected in site, f"Landing page version must say {expected}"
          assert 'android:networkSecurityConfig="@xml/network_security_config"' in manifest
          assert Path("app/src/main/res/xml/network_security_config.xml").is_file()
          print(f"Landing page version and network security config verified ({expected}).")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          # ndk and cmake: Automix's native analyzer and loop-mix renderer (pinned in app/build.gradle.kts).
          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;4.1.2"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK environment variable is missing."
            exit 1
          fi

          test -f "$SDK_ROOT/platforms/android-37.0/android.jar" || {
            echo "::error::Android API 37.0 platform is missing."
            exit 1
          }

          test -d "$SDK_ROOT/build-tools/36.0.0" || {
            echo "::error::Android Build Tools 36.0.0 are missing."
            exit 1
          }

          echo "Android SDK verified."
          echo "SDK root: $SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The permanent release key (repository secrets). Only on main: agent/** branches and PRs
      # run workflow code that anyone who can push can edit, so they never see the keystore.
      # Their release APK is debug-signed, which is fine for a check but never for publishing.
      - name: Restore release signing key
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          KEYSTORE_B64: ${{ secrets.MUSICFORGE_KEYSTORE_B64 }}
        shell: bash
        run: |
          # A step's own env isn't visible to its `if:`, so the empty case is handled here.
          [ -n "$KEYSTORE_B64" ] || { echo "No signing secret (fork PR?): release stays debug-signed."; exit 0; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/musicforge-release.jks"
          echo "MUSICFORGE_KEYSTORE=$RUNNER_TEMP/musicforge-release.jks" >> "$GITHUB_ENV"

      - name: Build, test and lint
        shell: bash
        env:
          # Empty off main, so the build falls back to the debug key there (see the restore step).
          MUSICFORGE_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MUSICFORGE_KEYSTORE_PASSWORD || '' }}
          MUSICFORGE_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.MUSICFORGE_KEY_ALIAS || '' }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --continue \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :innertube:testDebugUnitTest \
            :innertube:lintDebug

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: MusicForge-debug-apk-${{ github.run_number }}
          path: /dev/shm/musicforge-build-MusicForge/app/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      # Debug-signed off main, so uploading it there would hand out a build that looks like a release.
      # (The debug key is the least secret key in the repo: every laptop with Android Studio has a copy.)
      - name: Upload release APK
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: MusicForge-release-apk-${{ github.run_number }}
          path: /dev/shm/musicforge-build-MusicForge/app/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: MusicForge-reports-${{ github.run_number }}
          path: |
            /dev/shm/musicforge-build-MusicForge/app/reports/
            /dev/shm/musicforge-build-MusicForge/app/test-results/
            /dev/shm/musicforge-build-MusicForge/innertube/reports/
            /dev/shm/musicforge-build-MusicForge/innertube/test-results/
          if-no-files-found: ignore
          retention-days: 7
