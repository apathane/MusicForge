name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          cache: true
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('**/gradle.properties') }}

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK environment variable is missing."
            exit 1
          fi

          test -f "$SDK_ROOT/platforms/android-37.0/android.jar" || {
            echo "::error::Android API 37.0 platform is missing."
            exit 1
          }

          test -d "$SDK_ROOT/build-tools/36.0.0" || {
            echo "::error::Android Build Tools 36.0.0 are missing."
            exit 1
          }

          echo "Android SDK verified."
          echo "SDK root: $SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build, test and lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --continue \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :innertube:testDebugUnitTest \
            :innertube:lintDebug

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: MusicForge-debug-apk-${{ github.run_number }}
          path: /dev/shm/musicforge-build-MusicForge/app/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: MusicForge-reports-${{ github.run_number }}
          path: |
            /dev/shm/musicforge-build-MusicForge/app/reports/
            /dev/shm/musicforge-build-MusicForge/app/test-results/
            /dev/shm/musicforge-build-MusicForge/innertube/reports/
            /dev/shm/musicforge-build-MusicForge/innertube/test-results/
          if-no-files-found: ignore
          retention-days: 7
