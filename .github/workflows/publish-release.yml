name: Publish release

# Publishes whatever version app/build.gradle.kts declares, once: preview > 0 is a prerelease
# tagged pN-0.<phase>.<patch>, preview = 0 a regular release tagged v0.<phase>.<patch>.
# Title and notes come from .github/release-notes.md (first line is the title). Bump the
# version and rewrite that file in the same commit; anything else on main publishes nothing new.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - ".github/release-notes.md"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

concurrency:
  group: musicforge-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'apathane/MusicForge'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the merged source
        uses: actions/checkout@v7

      - name: Read the version and check whether it is already published
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          num() { grep -Po "^val $1 = \\K[0-9]+$" app/build.gradle.kts; }
          PHASE=$(num phase); PATCH=$(num patch); PREVIEW=$(num preview)
          if [ "$PREVIEW" -gt 0 ]; then
            TAG="p$PREVIEW-0.$PHASE.$PATCH"; CODE=$((PHASE * 100 + PATCH * 10 + PREVIEW)); PRE=--prerelease
            VERSION="0.$PHASE.$PATCH-p$PREVIEW"
          else
            TAG="v0.$PHASE.$PATCH"; CODE=$((PHASE * 100 + PATCH * 10 + 9)); PRE=--latest
            VERSION="0.$PHASE.$PATCH"
          fi
          APK_NAME="MusicForge-${TAG#v}.apk"
          { echo "tag=$TAG"; echo "code=$CODE"; echo "pre=$PRE"; echo "version=$VERSION"; echo "apk=$APK_NAME"; } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --json assets --jq "[.assets[].name] | contains([\"$APK_NAME\", \"SHA256SUMS.txt\"])" 2>/dev/null | grep -qx true; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already has both required assets; remaining steps will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        if: steps.release_check.outputs.exists != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        if: steps.release_check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;4.1.2"

      - name: Restore permanent release signing key
        if: steps.release_check.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.MUSICFORGE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Permanent release keystore secret is missing."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/musicforge-release.jks"
          echo "MUSICFORGE_KEYSTORE=$RUNNER_TEMP/musicforge-release.jks" >> "$GITHUB_ENV"

      - name: Build, test and lint release candidate
        if: steps.release_check.outputs.exists != 'true'
        env:
          MUSICFORGE_KEYSTORE_PASSWORD: ${{ secrets.MUSICFORGE_KEYSTORE_PASSWORD }}
          MUSICFORGE_KEY_ALIAS: ${{ secrets.MUSICFORGE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :innertube:testDebugUnitTest \
            :innertube:lintDebug

      - name: Verify the permanent signer, prepare release assets
        if: steps.release_check.outputs.exists != 'true'
        env:
          APK_NAME: ${{ steps.release_check.outputs.apk }}
          VERSION: ${{ steps.release_check.outputs.version }}
          CODE: ${{ steps.release_check.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /dev/shm/musicforge-build-MusicForge/app/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Release APK was not produced."; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner" || { echo "::error::apksigner is missing from the Android SDK."; exit 1; }
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "dist/$APK_NAME" | tee dist/signature.txt
          grep -Eiq 'a42e05a0ad85843b0eb3fd6a845794b4fe48730a8791c8d3d7a100befefba469' dist/signature.txt || {
            echo "::error::APK signer does not match the permanent preview 3 signing certificate."; exit 1;
          }
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          head -1 .github/release-notes.md > dist/title.txt
          # The updater reads "code NNNN" from the notes to order releases.
          { tail -n +2 .github/release-notes.md; echo; echo "Version $VERSION (code $CODE)."; } > dist/release-notes.md

      - name: Publish GitHub release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_check.outputs.tag }}
          PRE: ${{ steps.release_check.outputs.pre }}
          APK_NAME: ${{ steps.release_check.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="$(cat dist/title.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Recover a partially published release rather than silently skipping missing assets.
            gh release upload "$TAG" "dist/$APK_NAME" dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" "$PRE" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "dist/$APK_NAME" dist/SHA256SUMS.txt \
              --title "$TITLE" "$PRE" --target "$GITHUB_SHA" --notes-file dist/release-notes.md
          fi
