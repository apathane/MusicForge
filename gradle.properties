# 2 GB Gradle + 1.5 GB Kotlin: two builds (parallel worker worktrees) fit in 14 GB without
# touching swap, which on this machine is zram first and then a USB stick.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=600000
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
org.gradle.projectcachedir=/dev/shm/musicforge-gradle
